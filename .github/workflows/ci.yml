name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  egui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: egui-app

      - run: cargo clippy --manifest-path egui-app/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path egui-app/Cargo.toml
      - run: cargo test --manifest-path core/Cargo.toml
