name: Release

# Each run is a release: the version is 0.1.<run number>. The workflow sets it in the crates, builds, and
# once every build passes, tags a commit with the new version and drafts the GitHub release.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  VERSION: 0.1.${{ github.run_number }}

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag is new
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists"
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libxkbcommon-dev

      - name: Set the version
        shell: bash
        run: scripts/set-version.sh "$VERSION"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No credentials are compiled in: every user signs in with their own Airthings API client.
      - run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/airdash.exe -DestinationPath airdash-${{ matrix.target }}.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: tar -czf airdash-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release airdash

      # The desktop entry and icon let app launchers list AirDash (see "Installing on Linux" in the README).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/airdash dist/
          cp src/airdash/assets/com.christianhelle.airdash.desktop dist/
          cp src/airdash/assets/icon.png dist/com.christianhelle.airdash.png
          tar -czf airdash-${{ matrix.target }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: airdash-${{ matrix.target }}
          path: airdash-${{ matrix.target }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The tagged commit holds the version the artifacts were built with. It is not pushed to the branch,
      # which keeps its placeholder version.
      - name: Tag the release
        run: |
          scripts/set-version.sh "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: AirDash v${{ env.VERSION }}
          draft: true
          files: dist/*
