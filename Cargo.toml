[package]
name = "airdash"
version = "0.1.0"
description = "Desktop dashboard for Airthings air quality monitors"
authors = ["Christian Helle"]
edition = "2024"

[workspace]
members = ["airthings", "core"]

[dependencies]
airdash-core = { path = "core", version = "0.1.0" }
airthings = { path = "airthings", version = "0.1.0" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
# glow (OpenGL) instead of the default wgpu: wgpu probes every graphics API at startup, which made launching
# about 400 ms slower. Without wgpu, eframe renders with glow.
eframe = { version = "0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.36.2"
egui-winit = { version = "0.36.2", default-features = false, features = ["serde"] }
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }

# Keeps winit's default Linux features (Wayland window decorations, loading libwayland at runtime) that eframe
# only turns on with its default features.
[target.'cfg(target_os = "linux")'.dependencies]
winit = "0.30.13"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
