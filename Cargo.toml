[package]
name = "airdash"
version = "0.1.0"
description = "Desktop dashboard for Airthings air quality monitors"
authors = ["Christian Helle"]
edition = "2024"

[workspace]
members = ["core"]

[dependencies]
airdash-core = { path = "core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
eframe = "0.36.2"
egui = "0.36.2"
egui_plot = "0.37.0"
open = "5.4.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
rfd = "0.17.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread"] }
# KSNI talks D-Bus directly on Linux, so no GTK main loop is needed next to winit.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[build-dependencies]
winresource = "0.1.34"
