[package]
name = "airdash-core"
version = "0.1.0"
description = "Airthings Consumer API client, sign-in, refreshing and the saved app state for AirDash"
authors = ["Christian Helle"]
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
keyring = "4.2.0"

[dev-dependencies]
wiremock = "0.6.5"
