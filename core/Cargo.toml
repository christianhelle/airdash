[package]
name = "airdash-core"
version = "0.1.0"
description = "Refreshing, credential storage and the saved app state for AirDash"
authors = ["Christian Helle"]
edition = "2024"

[dependencies]
airthings = { path = "../airthings", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
