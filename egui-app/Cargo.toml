[package]
name = "airdash-egui"
version = "0.1.0"
description = "Desktop dashboard for Airthings air quality monitors, built with egui"
authors = ["Christian Helle"]
edition = "2024"

[dependencies]
airdash-core = { path = "../core" }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
eframe = "0.36.2"
egui = "0.36.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
