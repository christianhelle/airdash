[package]
name = "airdash"
version = "0.1.0"
description = "Desktop dashboard for Airthings air quality monitors"
authors = ["Christian Helle"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "airdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
airdash-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
