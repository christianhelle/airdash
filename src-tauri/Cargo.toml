[package]
name = "airdash"
version = "0.1.0"
description = "Desktop dashboard for Airthings air quality monitors"
authors = ["Christian Helle"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "airdash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"
keyring = "4.2.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
wiremock = "0.6.5"
