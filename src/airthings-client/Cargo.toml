[package]
name = "airthings-client"
version = "0.1.0"
description = "Client for the Airthings Consumer API, with OAuth sign-in and token refresh"
authors = ["Christian Helle"]
edition = "2024"
license = "MIT"
repository = "https://github.com/christianhelle/airdash"
readme = "README.md"
keywords = ["airthings", "air-quality", "radon", "iot", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "http2", "system-proxy"] }
sha2 = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"

[dev-dependencies]
wiremock = "0.6.5"
